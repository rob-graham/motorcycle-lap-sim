# Deliberately simple validation data; this does not represent a real motorcycle.
environment:
  gravity_mps2: 9.81
  air_density_kgpm3: 1.225
motorcycle:
  name: Analytic test motorcycle
  mass_kg: 200.0
  wheelbase_m: 1.4
  cg_height_m: 0.7
  cg_from_rear_m: 0.7
  wheel_radius_m: 0.30
aerodynamics:
  cda_m2: 0.40
rolling_resistance:
  crr: 0.015
tyres:
  mu_longitudinal: 1.2
  mu_lateral: 1.2
  max_lean_angle_deg: 50.0
powertrain:
  primary_ratio: 2.0
  gear_ratios: [2.0, 1.5]
  final_drive_ratio: 3.0
  driveline_efficiency: 0.90
  idle_rpm: 1000.0
  rev_limit_rpm: 10000.0
  torque_curve:
    - {rpm: 1000.0, torque_nm: 50.0}
    - {rpm: 5000.0, torque_nm: 100.0}
    - {rpm: 10000.0, torque_nm: 50.0}
