# Provisional 2017+ Yamaha YZF-R6 reference calibration.
# Parameter-by-parameter provenance is recorded in docs/r6_2017plus_calibration.md.
environment:
  gravity_mps2: 9.81
  air_density_kgpm3: 1.225

motorcycle:
  name: Yamaha YZF-R6 2017+ provisional stock reference
  mass_kg: 265.0
  wheelbase_m: 1.375
  cg_height_m: 0.625
  cg_from_rear_m: 0.625
  wheel_radius_m: 0.31

aerodynamics:
  cda_m2: 0.40

rolling_resistance:
  crr: 0.015

tyres:
  mu_longitudinal: 1.2
  mu_lateral: 1.2
  max_lean_angle_deg: 55.0

# LEGACY-REFERENCE / PROVISIONAL path-curvature transient proxy; not a measured
# steering-rate parameter. See docs/r6_2017plus_calibration.md.
handling:
  max_path_curvature_rate_1pmps: 0.8

powertrain:
  primary_ratio: 2.073170732
  gear_ratios:
    - 2.583
    - 2.000
    - 1.667
    - 1.444
    - 1.286
    - 1.150
  final_drive_ratio: 2.9375

  # This EMPIRICAL-ESTIMATE curve represents stock-like rear-wheel/chassis-dyno
  # output, so drivetrain loss has already occurred. Efficiency 1.0 avoids
  # applying that loss twice.
  driveline_efficiency: 1.0
  idle_rpm: 1500.0
  rev_limit_rpm: 16000.0

  torque_curve:
    - {rpm: 1500.0,  torque_nm: 28.0}
    - {rpm: 2000.0,  torque_nm: 31.0}
    - {rpm: 3000.0,  torque_nm: 35.0}
    - {rpm: 4000.0,  torque_nm: 39.0}
    - {rpm: 5000.0,  torque_nm: 44.0}
    - {rpm: 6000.0,  torque_nm: 48.0}
    - {rpm: 7000.0,  torque_nm: 51.0}
    - {rpm: 8000.0,  torque_nm: 54.0}
    - {rpm: 9000.0,  torque_nm: 56.0}
    - {rpm: 10000.0, torque_nm: 58.0}
    - {rpm: 10500.0, torque_nm: 59.0}
    - {rpm: 11000.0, torque_nm: 59.0}
    - {rpm: 12000.0, torque_nm: 58.5}
    - {rpm: 13000.0, torque_nm: 57.5}
    - {rpm: 14000.0, torque_nm: 56.0}
    - {rpm: 14500.0, torque_nm: 54.5}
    - {rpm: 15000.0, torque_nm: 52.0}
    - {rpm: 15500.0, torque_nm: 48.0}
    - {rpm: 16000.0, torque_nm: 40.0}
